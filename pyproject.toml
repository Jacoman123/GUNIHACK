[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vanta"
version = "0.1.0"
description = "A drone swarm that keeps searching when the radios go dark."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vanta = "vanta.__main__:main"

[tool.setuptools.packages.find]
include = ["vanta*"]

[tool.setuptools.package-data]
vanta = ["static/*"]
